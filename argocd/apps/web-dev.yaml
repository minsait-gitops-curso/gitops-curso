apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-dev
  namespace: argocd
  # Ao apagar a Application, o Argo CD também apaga os recursos que ela criou
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/minsait-gitops-curso/gitops-curso.git
    targetRevision: main
    path: apps/web/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: web-dev
  syncPolicy:
    automated:
      prune: true     # remove do cluster o que foi removido do Git
      selfHeal: true  # desfaz alterações manuais feitas no cluster
    syncOptions:
      - CreateNamespace=true
